name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: poort
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: poort_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poort" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://poort:ci-only@127.0.0.1:5432/poort_test
      CADDY_VERSION: "2.11.4"
      CADDY_SHA512: "8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Caddy ophalen voor de ketentest
        run: |
          curl -fsSL -o caddy.tgz "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          echo "${CADDY_SHA512}  caddy.tgz" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/caddy" && tar xzf caddy.tgz -C "$RUNNER_TEMP/caddy" caddy && rm caddy.tgz
          echo "CADDY_BIN=$RUNNER_TEMP/caddy/caddy" >> "$GITHUB_ENV"
      - name: Verify (lint, typecheck, alle tests incl. database en Caddy-keten, deps, lines)
        run: pnpm verify
      - name: Caddyfile geldig
        run: $CADDY_BIN validate --config infra/Caddyfile --adapter caddyfile
      - name: Kwetsbare pakketten
        run: pnpm audit --audit-level moderate
      - name: Gelekte sleutels (hele geschiedenis)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --no-banner
      - name: Container bouwt
        run: docker build -f infra/Dockerfile -t app-poort:ci .
      - name: Rookproef in de container (migreren, registreren, starten, health)
        run: |
          run() { docker run --rm --network host --read-only --cap-drop ALL \
            -e DATABASE_URL="$TEST_DATABASE_URL" -e PROEFAPP_URL=http://127.0.0.1:8081 \
            -e PUBLIC_URL=http://127.0.0.1:8080 "$@"; }
          run app-poort:ci node packages/db/src/migrate.ts
          run app-poort:ci node packages/db/src/seed.ts
          run -d --name poort app-poort:ci node apps/poort/src/server.ts
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3000/health && exit 0; sleep 1; done
          docker logs poort; exit 1
      - name: Hele stack met Docker Compose (start, healthchecks, poort en proefapp via Caddy)
        run: |
          docker rm -f poort
          cd infra
          printf 'POSTGRES_PASSWORD=%s\nPUBLIC_URL=http://127.0.0.1:8450\nPROEFAPP_URL=http://127.0.0.1:8451\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --build --wait --wait-timeout 180 || { docker compose ps; docker compose logs; exit 1; }
          curl -fsS http://127.0.0.1:8450/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8451/)" = 302
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8450/gate/verify)" = 404
          docker compose down -v
