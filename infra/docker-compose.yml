name: app-poort

x-app: &app
  image: ghcr.io/marcovandamme-ai/app-poort:${APP_VERSION:-dev}
  build:
    context: ..
    dockerfile: infra/Dockerfile
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [intern]

x-database: &database
  PGHOST: db
  PGUSER: poort
  PGDATABASE: poort
  PGPASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: poort
      POSTGRES_DB: poort
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [intern]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poort -d poort"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    command: sh -c "node packages/db/src/migrate.ts && node packages/db/src/seed.ts"
    environment:
      <<: *database
      PROEFAPP_URL: ${PROEFAPP_URL:?zet PROEFAPP_URL in .env}
    depends_on:
      db: { condition: service_healthy }

  poort:
    <<: *app
    command: node apps/poort/src/server.ts
    environment:
      <<: *database
      PUBLIC_URL: ${PUBLIC_URL:?zet PUBLIC_URL in .env}
      APP_VERSION: ${APP_VERSION:-dev}
      HSTS: ${HSTS:-false}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 6

  proefapp:
    <<: *app
    command: node apps/proefapp/src/server.ts
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 4s
      retries: 6

  caddy:
    # Minimaal 2.11.4; de regels in de Caddyfile dekken CVE-2026-30851 ook zelf af.
    image: caddy:2.11.4
    restart: unless-stopped
    # Het Caddy-programma in de image draagt zelf NET_BIND_SERVICE; zonder start het niet.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "127.0.0.1:${POORT_PORT:-8450}:8080"
      - "127.0.0.1:${PROEFAPP_PORT:-8451}:8081"
    depends_on:
      poort: { condition: service_healthy }
      proefapp: { condition: service_healthy }
    networks: [intern]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 4s
      retries: 6

networks:
  intern:

volumes:
  db-data:
  caddy-data:
  caddy-config:
